name: MW Play Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/mw-play-native
      - feat/mw-play-mobile
      - feat/mw-play-tv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stream-server:
    name: Build native server ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: armeabi-v7a, rust-target: armv7-linux-androideabi, vcpkg-triplet: arm-android }
          - { abi: arm64-v8a, rust-target: aarch64-linux-android, vcpkg-triplet: arm64-android }
          - { abi: x86, rust-target: i686-linux-android, vcpkg-triplet: x86-android }
          - { abi: x86_64, rust-target: x86_64-linux-android, vcpkg-triplet: x64-android }
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      # Build from this repository's stream-server submodule pointer, not a separately pinned SHA.
      - uses: actions/checkout@v4
      - run: git submodule update --init stream-server
      - name: Read pinned native toolchain
        id: toolchain
        run: grep -E '^[A-Z_]+=' native/stream-server-toolchain.env >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-target }}
      - run: cargo install cargo-ndk --version ${{ steps.toolchain.outputs.CARGO_NDK_VERSION }} --locked
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with: { ndk-version: "${{ steps.toolchain.outputs.ANDROID_NDK_RELEASE }}" }
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
      # The key covers everything that changes the installed packages; no stale prefix fallback.
      - uses: actions/cache@v4
        with:
          path: vcpkg_installed-${{ matrix.abi }}
          key: mw-play-vcpkg-${{ matrix.vcpkg-triplet }}-${{ hashFiles('stream-server/vcpkg.json', 'stream-server/vcpkg-overlays/**', format('native/vcpkg-triplets/{0}.cmake', matrix.vcpkg-triplet), 'native/stream-server-toolchain.env') }}
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.toolchain.outputs.VCPKG_COMMIT }}
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'stream-server/vcpkg.json'
          runVcpkgInstall: false
      - name: Build native streaming server
        run: bash native/build-stream-server.sh ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          STREAM_SERVER_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}
          STREAM_SERVER_OUTPUT_DIR: ${{ github.workspace }}/jniLibs
      - run: test -s jniLibs/${{ matrix.abi }}/libstream_server.so
      - uses: actions/upload-artifact@v4
        with: { name: "mw-play-stream-server-${{ matrix.abi }}", path: jniLibs/, if-no-files-found: error }

  build:
    name: Build MW Play ${{ github.ref_name }} Debug APK
    runs-on: ubuntu-latest
    needs: build-stream-server
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/download-artifact@v4
        with: { pattern: "mw-play-stream-server-*", path: app/src/main/jniLibs/, merge-multiple: true }
      - run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do test -s "app/src/main/jniLibs/${abi}/libstream_server.so"; done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:compileDebugKotlin :app:assembleDebug --warning-mode all
      - run: python .github/scripts/verify-apk-outputs.py app/build/outputs/apk/debug armeabi-v7a arm64-v8a x86 x86_64 universal
      - name: Verify stream server is packaged in APKs
        run: |
          python - <<'PY'
          import glob, zipfile
          apks=glob.glob('app/build/outputs/apk/debug/*.apk')
          if not apks: raise SystemExit('No APKs found')
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  if not any(n.endswith('/libstream_server.so') for n in z.namelist()): raise SystemExit(f'{apk}: libstream_server.so missing')
          PY
      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-tv-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
      - name: Upload armeabi-v7a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-tv-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
      - name: Upload x86 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-tv-x86-debug
          path: app/build/outputs/apk/debug/*x86-debug.apk
          if-no-files-found: error
      - name: Upload x86_64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-tv-x86_64-debug
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-tv-universal-debug
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
