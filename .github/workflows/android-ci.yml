name: MW Play Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/mw-play-native
      - feat/mw-play-mobile
      - feat/mw-play-tv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stream-server:
    name: Build native server ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
            vcpkg-triplet: arm-android
            vcpkg-arch: arm
            android-abi: armeabi-v7a
            make-host: armv7a-linux-androideabi
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
            vcpkg-triplet: arm64-android
            vcpkg-arch: arm64
            android-abi: arm64-v8a
            make-host: aarch64-linux-android
          - abi: x86
            rust-target: i686-linux-android
            vcpkg-triplet: x86-android
            vcpkg-arch: x86
            android-abi: x86
            make-host: i686-linux-android
          - abi: x86_64
            rust-target: x86_64-linux-android
            vcpkg-triplet: x64-android
            vcpkg-arch: x64
            android-abi: x86_64
            make-host: x86_64-linux-android
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: perpetus/stream-server
          ref: 368666eb09f9c4849a7df7f2a6a8b26171f24cfb
          path: stream-server
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - run: cargo install cargo-ndk
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
      - uses: actions/cache@v4
        with:
          path: vcpkg_installed-${{ matrix.abi }}
          key: mw-play-vcpkg-${{ matrix.vcpkg-triplet }}-${{ hashFiles('stream-server/vcpkg.json') }}
          restore-keys: |
            mw-play-vcpkg-${{ matrix.vcpkg-triplet }}-
            android-vcpkg-${{ matrix.vcpkg-triplet }}-
      - name: Create Android triplet
        shell: bash
        run: |
          mkdir -p stream-server/triplets
          cat > stream-server/triplets/${{ matrix.vcpkg-triplet }}.cmake << 'EOF'
          set(VCPKG_TARGET_ARCHITECTURE ${{ matrix.vcpkg-arch }})
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Android)
          set(VCPKG_CMAKE_SYSTEM_VERSION 24)
          set(VCPKG_MAKE_BUILD_TRIPLET "--host=${{ matrix.make-host }}")
          EOF
          if [[ "${{ matrix.android-abi }}" == "armeabi-v7a" ]]; then echo 'set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=armeabi-v7a -DANDROID_ARM_NEON=ON)' >> stream-server/triplets/${{ matrix.vcpkg-triplet }}.cmake; else echo 'set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=${{ matrix.android-abi }})' >> stream-server/triplets/${{ matrix.vcpkg-triplet }}.cmake; fi
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'stream-server/vcpkg.json'
          runVcpkgInstall: false
      - name: Install native dependencies
        working-directory: stream-server
        run: ${{ github.workspace }}/vcpkg/vcpkg install --triplet ${{ matrix.vcpkg-triplet }} --x-install-root=${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }} --overlay-triplets=triplets --overlay-ports=vcpkg-overlays
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Build native streaming server
        working-directory: stream-server/server
        run: cargo ndk --target ${{ matrix.rust-target }} --platform 24 build --release --features libtorrent --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}
          VCPKGRS_TRIPLET: ${{ matrix.vcpkg-triplet }}
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}/${{ matrix.vcpkg-triplet }}/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}/${{ matrix.vcpkg-triplet }}
          OPENSSL_DIR: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}/${{ matrix.vcpkg-triplet }}
      - run: mkdir -p jniLibs/${{ matrix.abi }} && cp stream-server/target/${{ matrix.rust-target }}/release/libstream_server.so jniLibs/${{ matrix.abi }}/ && test -s jniLibs/${{ matrix.abi }}/libstream_server.so
      - uses: actions/upload-artifact@v4
        with:
          name: mw-play-stream-server-${{ matrix.abi }}
          path: jniLibs/
          if-no-files-found: error
  build:
    name: Build MW Play ${{ github.ref_name }} Debug APK
    runs-on: ubuntu-latest
    needs: build-stream-server
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: mw-play-stream-server-*
          path: app/src/main/jniLibs/
          merge-multiple: true
      - run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do test -s "app/src/main/jniLibs/${abi}/libstream_server.so"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Compile and assemble debug
        run: ./gradlew :app:compileDebugKotlin :app:assembleDebug --warning-mode all
      - run: python .github/scripts/verify-apk-outputs.py app/build/outputs/apk/debug armeabi-v7a arm64-v8a x86 x86_64 universal
      - name: Verify stream server is packaged in APKs
        run: |
          python - <<'PY'
          import glob, zipfile
          for apk in glob.glob('app/build/outputs/apk/debug/*.apk'):
              with zipfile.ZipFile(apk) as z:
                  if not any(n.endswith('/libstream_server.so') for n in z.namelist()): raise SystemExit(f'{apk}: libstream_server.so missing')
          PY
      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-mobile-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
      - name: Upload armeabi-v7a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-mobile-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
      - name: Upload x86 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-mobile-x86-debug
          path: app/build/outputs/apk/debug/*x86-debug.apk
          if-no-files-found: error
      - name: Upload x86_64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-mobile-x86_64-debug
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-mobile-universal-debug
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
