name: MW Play TV Release APK

on:
  push:
    branches:
      - feat/mw-play-tv
    paths:
      - .github/release-request.json
    tags:
      - "tv-v[0-9]*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão já configurada em gradle.properties (ex.: 1.0.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mw-play-release-tv
  cancel-in-progress: false

env:
  RELEASE_PLATFORM: tv
  RELEASE_FILE_PREFIX: MW-Play-TV

jobs:
  prepare:
    name: Validate TV release request
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source branch and version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version_name }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          platform = os.environ['RELEASE_PLATFORM']
          branch = f'feat/mw-play-{platform}'
          properties = dict(re.findall(r'^(VERSION_NAME|VERSION_CODE)=(.+)$', Path('gradle.properties').read_text(), re.MULTILINE))
          version = properties['VERSION_NAME'].strip()
          code = int(properties['VERSION_CODE'])
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or not 125 <= code <= 2100000000:
              raise SystemExit('Invalid release version or versionCode; preserve upgrade compatibility with code >= 125')
          request = json.loads(Path('.github/release-request.json').read_text())
          if request.get('platform') != platform or request.get('version_name') != version or request.get('version_code') != code:
              raise SystemExit('Release request must match this platform and gradle.properties exactly')
          tag = ('v' if platform == 'mobile' else 'tv-v') + version
          ref_type, ref_name = os.environ['GITHUB_REF_TYPE'], os.environ['GITHUB_REF_NAME']
          if ref_type == 'branch' and ref_name != branch:
              raise SystemExit(f'Release must originate from {branch}')
          if ref_type == 'tag' and ref_name != tag:
              raise SystemExit(f'Unexpected platform release tag: {ref_name}')
          if ref_type not in ('branch', 'tag'):
              raise SystemExit('Unsupported release ref type')
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and os.environ['DISPATCH_VERSION'] != version:
              raise SystemExit('Requested version must match gradle.properties')
          subprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['GITHUB_SHA'], f'origin/{branch}'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version_name={version}\nversion_code={code}\nrelease_tag={tag}\n')
          print(f'Validated {platform} {version} ({code}) from {branch} at {os.environ["GITHUB_SHA"]}')
          PY
      - name: Require existing production signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required existing production signing secret ${name}"
              exit 1
            fi
          done
      - name: Refuse published releases or unrelated drafts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo, tag, sha = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG'], os.environ['GITHUB_SHA']
          result = subprocess.run(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'isDraft,targetCommitish,body'], capture_output=True, text=True)
          if result.returncode:
              if 'release not found' not in result.stderr.lower() and 'http 404' not in result.stderr.lower():
                  raise SystemExit(result.stderr)
          else:
              release = json.loads(result.stdout)
              if not release['isDraft']:
                  raise SystemExit('Release is already published; refusing to replace existing assets')
              if release['targetCommitish'] != sha or f'Source commit: `{sha}`' not in release['body']:
                  raise SystemExit('Existing draft belongs to another source commit; refusing to overwrite it')
          PY

  build-stream-server:
    name: Build native server ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
            vcpkg-triplet: arm-android
            vcpkg-arch: arm
            android-abi: armeabi-v7a
            make-host: armv7a-linux-androideabi
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
            vcpkg-triplet: arm64-android
            vcpkg-arch: arm64
            android-abi: arm64-v8a
            make-host: aarch64-linux-android
          - abi: x86
            rust-target: i686-linux-android
            vcpkg-triplet: x86-android
            vcpkg-arch: x86
            android-abi: x86
            make-host: i686-linux-android
          - abi: x86_64
            rust-target: x86_64-linux-android
            vcpkg-triplet: x64-android
            vcpkg-arch: x64
            android-abi: x86_64
            make-host: x86_64-linux-android
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout stream-server
        uses: actions/checkout@v4
        with:
          repository: perpetus/stream-server
          ref: 368666eb09f9c4849a7df7f2a6a8b26171f24cfb
          path: stream-server

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed-${{ matrix.abi }}
          key: mw-play-vcpkg-${{ matrix.vcpkg-triplet }}-${{ hashFiles('stream-server/vcpkg.json') }}
          restore-keys: |
            mw-play-vcpkg-${{ matrix.vcpkg-triplet }}-
            android-vcpkg-${{ matrix.vcpkg-triplet }}-

      - name: Create Android triplet
        shell: bash
        run: |
          mkdir -p stream-server/triplets
          cat > stream-server/triplets/${{ matrix.vcpkg-triplet }}.cmake << 'EOF'
          set(VCPKG_TARGET_ARCHITECTURE ${{ matrix.vcpkg-arch }})
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Android)
          set(VCPKG_CMAKE_SYSTEM_VERSION 24)
          set(VCPKG_MAKE_BUILD_TRIPLET "--host=${{ matrix.make-host }}")
          EOF
          if [[ "${{ matrix.android-abi }}" == "armeabi-v7a" ]]; then
            echo 'set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=armeabi-v7a -DANDROID_ARM_NEON=ON)' >> stream-server/triplets/${{ matrix.vcpkg-triplet }}.cmake
          else
            echo 'set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=${{ matrix.android-abi }})' >> stream-server/triplets/${{ matrix.vcpkg-triplet }}.cmake
          fi

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'stream-server/vcpkg.json'
          runVcpkgInstall: false

      - name: Install native dependencies
        working-directory: stream-server
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet ${{ matrix.vcpkg-triplet }} \
            --x-install-root=${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }} \
            --overlay-triplets=triplets \
            --overlay-ports=vcpkg-overlays
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build native streaming server
        working-directory: stream-server/server
        run: cargo ndk --target ${{ matrix.rust-target }} --platform 24 build --release --features libtorrent --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}
          VCPKGRS_TRIPLET: ${{ matrix.vcpkg-triplet }}
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}/${{ matrix.vcpkg-triplet }}/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}/${{ matrix.vcpkg-triplet }}
          OPENSSL_DIR: ${{ github.workspace }}/vcpkg_installed-${{ matrix.abi }}/${{ matrix.vcpkg-triplet }}

      - name: Prepare JNI library
        run: |
          mkdir -p jniLibs/${{ matrix.abi }}
          cp stream-server/target/${{ matrix.rust-target }}/release/libstream_server.so jniLibs/${{ matrix.abi }}/
          test -s jniLibs/${{ matrix.abi }}/libstream_server.so

      - name: Upload JNI library
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-release-stream-server-${{ matrix.abi }}
          path: jniLibs/
          if-no-files-found: error


  release:
    name: Test, build and publish MW Play TV
    runs-on: ubuntu-latest
    needs: [prepare, build-stream-server]
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Download native JNI libraries
        uses: actions/download-artifact@v4
        with:
          pattern: mw-play-release-stream-server-*
          path: app/src/main/jniLibs/
          merge-multiple: true

      - name: Verify native libraries before APK build
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/src/main/jniLibs/${abi}/libstream_server.so"
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      - name: Decode existing production signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_file="${RUNNER_TEMP}/mw-play-release.keystore"
          umask 077
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_file}"
          test -s "${keystore_file}"
          echo "ANDROID_KEYSTORE_FILE=${keystore_file}" >> "${GITHUB_ENV}"

      - name: Test and build signed release APKs
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: >
          ./gradlew :app:testDebugUnitTest :mpv-android-lib:assembleRelease :app:assembleRelease
          --warning-mode all -PVERSION_CODE=${VERSION_CODE} -PVERSION_NAME=${VERSION_NAME}

      - name: Test release validation scripts
        run: python -m unittest discover -s .github/scripts/tests -v

      - name: Download published 1.0.2 for upgrade and signature verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/previous-release"
          gh release download v1.0.2 --repo "${GITHUB_REPOSITORY}" \
            --pattern 'MW-Play-v1.0.2-armeabi-v7a-release.apk' --dir "${RUNNER_TEMP}/previous-release"

      - name: Verify release identity, production signature and native packaging
        run: |
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          python .github/scripts/validate-release-apks.py \
            --apk-dir app/build/outputs/apk/release \
            --previous-apk "${RUNNER_TEMP}/previous-release/MW-Play-v1.0.2-armeabi-v7a-release.apk" \
            --version-name "${VERSION_NAME}" --version-code "${VERSION_CODE}" \
            --platform "${RELEASE_PLATFORM}" --apksigner "${build_tools}/apksigner" --aapt "${build_tools}/aapt" \
            --report-path "dist/${RELEASE_FILE_PREFIX}-v${VERSION_NAME}-provenance.json"

      - name: Prepare platform-specific release assets
        run: |
          python .github/scripts/collect-apks.py \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --apk-dir app/build/outputs/apk/release --output-dir dist \
            --version-name "${VERSION_NAME}" --build-type release --file-prefix "${RELEASE_FILE_PREFIX}"
          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt "dist/${RELEASE_FILE_PREFIX}-v${VERSION_NAME}-mapping.txt"
          (cd dist && sha256sum --check "${RELEASE_FILE_PREFIX}-v${VERSION_NAME}-SHA256SUMS.txt")

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mw-play-tv-release-${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error

      - name: Publish complete GitHub Release from exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo, tag, sha = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG'], os.environ['GITHUB_SHA']
          platform, version = os.environ['RELEASE_PLATFORM'], os.environ['VERSION_NAME']
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          def release_info():
              return json.loads(gh('release', 'view', tag, '--repo', repo, '--json', 'isDraft,targetCommitish,body,assets'))
          def verify_draft(release):
              if not release['isDraft'] or release['targetCommitish'] != sha or f'Source commit: `{sha}`' not in release['body']:
                  raise SystemExit('Release is not a draft from this exact source commit; refusing to overwrite assets')
          assets = sorted(Path('dist').iterdir())
          if len(assets) != 8 or any(not asset.is_file() or not asset.stat().st_size for asset in assets):
              raise SystemExit('Expected exactly 5 APKs, checksums, mapping and provenance')
          result = subprocess.run(['gh', 'release', 'view', tag, '--repo', repo], capture_output=True, text=True)
          draft_exists = result.returncode == 0
          if draft_exists:
              verify_draft(release_info())
          elif 'release not found' not in result.stderr.lower() and 'http 404' not in result.stderr.lower():
              raise SystemExit(result.stderr)
          endpoint = f'repos/{repo}/git/ref/tags/{tag}'
          reference_result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
          if reference_result.returncode:
              if 'http 404' not in reference_result.stderr.lower():
                  raise SystemExit(reference_result.stderr)
              gh('api', f'repos/{repo}/git/refs', '--method', 'POST', '-f', f'ref=refs/tags/{tag}', '-f', f'sha={sha}')
          reference = json.loads(gh('api', endpoint))['object']
          while reference['type'] == 'tag':
              reference = json.loads(gh('api', f'repos/{repo}/git/tags/{reference["sha"]}'))['object']
          if reference['type'] != 'commit' or reference['sha'] != sha:
              raise SystemExit('Release tag does not resolve to the exact build source commit')
          if not draft_exists:
              notes = Path(os.environ['RUNNER_TEMP']) / 'mw-play-release-notes.md'
              body = Path('.github/release-notes.md').read_text().rstrip()
              notes.write_text(body + f'\n\nSource branch: `feat/mw-play-{platform}`\n\nSource commit: `{sha}`\n')
              gh('release', 'create', tag, '--repo', repo, '--draft', '--verify-tag', '--target', sha,
                 '--title', f'MW Play {"Mobile" if platform == "mobile" else "TV"} {version}',
                 '--notes-file', str(notes), '--latest=false')
          verify_draft(release_info())
          gh('release', 'upload', tag, '--repo', repo, *map(str, assets), '--clobber')
          release = release_info()
          verify_draft(release)
          expected = {asset.name: asset.stat().st_size for asset in assets}
          actual = {asset['name']: asset['size'] for asset in release['assets']}
          if actual != expected or len(release['assets']) != len(assets):
              raise SystemExit('Uploaded release assets differ from the validated local assets')
          gh('release', 'edit', tag, '--repo', repo, '--draft=false', f'--latest={"true" if platform == "mobile" else "false"}')
          print(f'Published {tag} from {sha} with {len(assets)} verified assets')
          PY

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/mw-play-release.keystore"
